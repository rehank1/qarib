# Cloudflare Worker for the Qarīb API (free plan). Deploy: see README → "Deploy the API".
name = "qarib-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "qarib"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# Origins allowed to call the API: the Android app (Capacitor) and the website. Comma-separated.
ALLOWED_ORIGINS = "https://localhost,http://localhost:4180"

# Daily housekeeping: drop expired sessions, old rate-limit rows and metrics older than 90 days.
[triggers]
crons = ["17 3 * * *"]

# Secret (never in this file): PEPPER — set once with `npx wrangler secret put PEPPER` (any 40+ random characters).
