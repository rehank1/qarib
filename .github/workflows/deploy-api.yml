# Deploys the API Worker to Cloudflare when api/ changes on main (needs the CLOUDFLARE_API_TOKEN secret).
name: Deploy API
on:
  push:
    branches: [main]
    paths: ['api/**', 'src/core/validate.js', 'src/features/masjids/overpass.js']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip until Cloudflare is set up
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the API (see README)."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: api
        run: npx --yes wrangler@4 deploy
