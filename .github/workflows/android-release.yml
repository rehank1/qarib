# Builds the signed Android APK and publishes it as a GitHub Release.
# Release a new version:  1) set CONFIG.version in src/config.js (e.g. 1.0.1)  2) git tag v1.0.1  3) git push origin v1.0.1
# Users then see "Version 1.0.1 is available" in the app and download the APK from the release page.
name: Android release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {} # manual run: builds the APK as a downloadable artifact, no release

permissions:
  contents: write # create the release; nothing else

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP=$(node -e "import('./src/config.js').then(m => console.log(m.CONFIG.version))")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP" != "$TAG" ]; then echo "src/config.js says $APP but the tag is v$TAG"; exit 1; fi

      - name: Test and build the web app (tests must pass)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Restore the signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (see README)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qarib-release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/qarib-release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: qarib
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -3
          mkdir -p ../dist && cp "$APK" "../dist/Qarib-${VERSION_NAME}.apk"
          cd ../dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/qarib-release.p12"

      - name: Upload the APK (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: qarib-apk
          path: dist/
          retention-days: 14

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --title "Qarīb $GITHUB_REF_NAME" \
            --notes "Download **Qarib-$GITHUB_REF_NAME.apk** below and open it on your Android phone. If Android asks, allow installing from this source. The SHA-256 checksum is in SHA256SUMS.txt."
